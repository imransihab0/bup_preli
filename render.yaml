# Render Blueprint. Create the service with:
#   Render dashboard -> New -> Blueprint -> point at this repository.
# Then set OPENAI_API_KEY in the service's Environment tab (sync: false
# below means Render will not read it from this file - it is never committed).
services:
  - type: web
    name: gridwise-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: OPENAI_API_KEY
        sync: false
      - key: GRIDWISE_MODEL
        value: gpt-5.6-luna
      - key: GRIDWISE_REASONING_EFFORT
        value: low
      - key: GRIDWISE_LLM_TIMEOUT
        value: "12"
      - key: GRIDWISE_LLM_MAX_RETRIES
        value: "1"
